<!DOCTYPE html> 
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-bs-theme=${tema == 'escuro' ? 'dark' : 'light'}"> 
    <head> 
        <meta charset="utf-8"> 
        <title>Gerenciamento de Filmes</title> 
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    </head> 
    <body> 
        <div class="container my-2"> 
            <h1>Lista de Filmes</h1> 
            <a th:href="@{/cadastro}" class="btn btn-primary btn-sm mb-3"> Adicionar </a> 
            <table id="tabelaFilmes" class="table table-striped table-responsive-md"> 
                <thead> 
                    <tr> 
                        <th>ID</th> 
                        <th>Título</th> 
                        <th>Sinopse</th> 
                        <th>Gênero</th> 
                        <th>Ano de Lançamento</th> 
                        <th>Operações</th> 
                    </tr> 
                </thead> 
                <tbody></tbody> 
            </table>  
        </div> 
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script th:src="@{/js/script.js}"></script>
    </body>     
</html>
