<!DOCTYPE html> 
<html lang="en" xmlns:th="http://www.thymeleaf.org"> 
    <head> 
        <meta charset="utf-8"> 
        <title>Gerenciamento de Filmes</title> 
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    </head> 
    <body> 
        <div class="container my-2"> 
            <h1>Lista de Filmes</h1> 
            <a href="" class="btn btn-primary btn-sm mb-3"> Adicionar </a> 
            <table border="1" class="table table-striped table-responsive-md"> 
                <thead> 
                    <tr> 
                        <th>ID</th> 
                        <th>Título</th> 
                        <th>Sinopse</th> 
                        <th>Gênero</th> 
                        <th>Ano de Lançamento</th> 
                        <th>Operações</th> 
                    </tr> 
                </thead> 
                <tbody> 
                    <tr each="filme : ${listarFilmes}"> 
                        <td text="${filme.id}"></td> 
                        <td text="${filme.titulo}"></td> 
                        <td text="${filme.sinopse}"></td>  
                        <td text="${filme.genero}"></td> 
                        <td text="${filme.anoLancamento}"></td> 
                        <td> <a href="" class="btn btn-primary">Atualizar</a> 
                            <a href="" class="btn btn-danger" onclick="return confirm('Tem certeza?');">Excluir</a> 
                        </td> 
                    </tr> 
                </tbody> 
            </table>  
        </div> 
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script th:src="@{/js/script.js}"></script>
    </body>     
</html>
