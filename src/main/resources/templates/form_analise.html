<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Salvar Análise</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></head>
</head>
<body>
    <div class="container my-4">
        <h1>Análise de Filme</h1>
        <hr>
        
        <!-- O th:action muda dinamicamente dependendo se a análise tem ID (Edição) ou não (Criação) -->
            <form th:action="${analiseObj.id == null} ? @{/salvarAnalise/{filmeId}(filmeId=${filmeId})} : @{/editarAnalise/{id}(id=${analiseObj.id})}" 
              th:object="${analiseObj}" method="POST">
            
            <input type="hidden" th:field="*{id}">
            <!-- <input type="hidden"> -->
            
            <div class="form-group">
                <label>Nota (Ex: 8.5):</label>
                <input type="number" step="0.1" th:field="*{nota}" class="form-control col-4" placeholder="Insira a nota">
            </div>

            <div class="form-group">
                <label>Texto da Análise:</label>
                <textarea th:field="*{analise}" class="form-control col-6" rows="4" placeholder="Escreva a análise..."></textarea>
            </div>

            <button type="submit" class="btn btn-info mt-3">Salvar Análise</button>
            <a th:href="@{/atualizarFilmeForm/{id}(id=${filmeId})}" class="btn btn-secondary mt-3 ml-2">Cancelar</a>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

</body>
</html>
