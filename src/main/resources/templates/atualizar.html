<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar dados</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></head>
<body>
    <div class="container">
        <h1>Atualizar dados do filme</h1>
        <hr>
        <h2>Atualizar cadastro do filme</h2>
        <form action="#" action=""method="POST">
            <!-- Campo oculto para o ID (para quando for edição) -->
            <input type="hidden" field="*{id}">

            <input type="text"  placeholder="Insira o título" class="form-control mt-4 col-4">
            
            <input type="text"  placeholder="Insira a sinopse" class="form-control mt-4 col-4">

            <input type="text" placeholder="Insira o gênero" class="form-control mt-4 col-4">

            <input type="number"  placeholder="Insira o ano de lançamento" class="form-control mt-4 col-4">

            <button type="submit" class="btn btn-info mt-4">Salvar</button>
        </form>
        <hr>
        <a href="">Retornar</a>
    </div>

    <hr class="my-5">

    <div class="row">
        <div class="col-12">
            <h3>Análises do Filme</h3>
            
            <!-- botão para adicionar nova análise (passando o ID do filme na URL) -->
            <a href="" class="btn btn-success btn-sm mb-3">
                Adicionar Nova Análise
            </a>

            <table border="1" class="table table-striped table-responsive-md">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nota</th>
                        <th>Análise</th>
                        <th>Operações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr each="analise : ${listaAnalises}">
                        <td text="${analise.id}"></td>
                        <td text="${analise.nota}"></td>
                        <td text="${analise.analise}"></td>
                        <td> 
                            <a href="" class="btn btn-primary btn-sm">Editar</a>
                            <a href="" class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza?');">Excluir</a>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="text-center">Nenhuma análise cadastrada.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
