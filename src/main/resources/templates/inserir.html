<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <title>Inserir novo Filme</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    </head>
    <body>
        <div class="container">
            <h1>Gerenciar filmes na plataforma</h1>
            <hr>
            <h2>Adicionar filme</h2>
            <form id="formCadastrarFilme">
                <input type="text" placeholder="Insira o título" class="form-control mt-4 col-4" id="titulo">
                <input type="text" placeholder="Insira a sinopse" class="form-control mt-4 col-4"id="sinopse">
                <input type="text" placeholder="Insira o gênero" class="form-control mt-4 col-4" id="genero">
                <input type="number" placeholder="Insira o ano de lançamento" class="form-control mt-4 col-4" id="anoLancamento">
                <button type="submit" class="btn btn-success">Salvar Filme</button>
            </form>
            <hr>
            <a href="/" class="btn btn-secondary"> Retornar</a>
        </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script th:src="@{/js/script.js}"></script>
    </body>
</html>
